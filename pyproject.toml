[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-lifecycle"
version = "1.0.0"
description = "Agent-led Meta Ads research, creation, monitoring and scaling."
requires-python = ">=3.11"
dependencies = ["tzdata>=2025.1"]

[project.scripts]
meta-ads = "meta_ads.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meta_ads = ["registry.json"]
